<body class="bg-slate-950 text-slate-100 min-h-screen antialiased">
<div id="app" class="max-w-3xl mx-auto px-4 pb-32"></div>
<div id="modal"></div>
<div id="toast" role="status" aria-live="polite" class="toast toast-safe fixed left-1/2 -translate-x-1/2 z-50 max-w-[90vw] text-center opacity-0 pointer-events-none bg-slate-100 text-slate-900 text-sm font-semibold px-4 py-2 rounded-full shadow-xl"></div>

<script>
/* ================== STATE & STORAGE ================== */
// Every game (its own players, settings, hands and leaderboard) is saved separately.
const KEY = 'marriage_tracker_v1';
const APP_VERSION = '1.0.0';
// Maal values are NOT linear: 2 poplu = 5, not 2+2. Each list is [1 card, 2 cards, 3 cards, shown as tunnela].
// max = most copies one player can hold (3 decks = 3 copies of each card; tiplu & marriage max 2).
const MAAL = [
  { k:'marriage', l:'Marriage', hint:'Jhiplu + Tiplu + Poplu in one sequence', max:2, cols:2 },
  { k:'tiplu',    l:'Tiplu',    hint:'Joker card, not inside a marriage',     max:2, cols:2 },
  { k:'poplu',    l:'Poplu',    hint:'One above tiplu, same suit',           max:3, cols:4 },
  { k:'jhiplu',   l:'Jhiplu',   hint:'One below tiplu, same suit',           max:3, cols:4 },
  { k:'alter',    l:'Alter',    hint:'Tiplu rank, same colour, other suit',  max:3, cols:4 },
  { k:'man',      l:'Man',      hint:'Printed joker (if used)',              max:3, cols:4 },
  { k:'tun',      l:'Tunnela',  hint:'Ordinary cards · each',                max:7, each:true },
  { k:'jtun',     l:'Joker tunnela', hint:'Ordinary joker (tiplu rank, other colour) · each', max:2, each:true },
];
const DEFAULT_VALS = () => ({ marriage:[10,30], tiplu:[3,8], poplu:[2,5,10,15], jhiplu:[2,5,10,15],
  alter:[5,15,25,35], man:[5,15,25,45], tun:5, jtun:10 });
const COLS = ['×1','×2','×3','Tunnela'];
const HAND_MIN = 2, HAND_MAX = 5, ROSTER_MAX = 8, MAAL_MAX = 999;
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
function fresh(){
  return { id:uid(), name:'', created:Date.now(), updated:Date.now(), phase:'setup', tab:'table', settled:false,
    config:{ rate:5, seenPts:3, unseenPts:10, dubleeBonus:5, vals:DEFAULT_VALS() },
    setupNames:['','',''], players:[], hands:[], current:null, sitOut:[], dealer:0 };
}
function loadDB(){ try{ const d = JSON.parse(localStorage.getItem(KEY)); if (d && Array.isArray(d.games)) return d; }catch(e){} return { games:[], activeId:null }; }
let DB = loadDB();
// Older saves used single flat maal values — upgrade them to the per-count tables.
DB.games.forEach(g => { if (!g.config.vals || !Array.isArray(g.config.vals.poplu)) g.config.vals = DEFAULT_VALS(); });
let S = DB.activeId ? DB.games.find(g => g.id === DB.activeId) || null : null;
function save(){ DB.activeId = S ? S.id : null; try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){} }
function touch(){ if (S) S.updated = Date.now(); }
function openGame(id){ S = DB.games.find(g => g.id === id) || null; }

/* ================== HELPERS ================== */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2 = x => Math.round(x*100)/100;
const num = v => { const x = Number(v); return isFinite(x) ? x : 0; };
const pname = id => (S.players.find(p => p.id === id) || {}).name || '?';
const rate = () => num(S.config.rate) || 0;
const fmtN = v => Math.abs(r2(v)).toLocaleString('en-IN', {maximumFractionDigits:2});
const sign = v => v > 0.004 ? '+' : v < -0.004 ? '−' : '';
const pts = (v, signed=true) => `${signed ? sign(v) : (v < 0 ? '−' : '')}${fmtN(v)}`;
const money = (p, signed=true) => { const v = p * rate(); return `${signed ? sign(v) : ''}Rs. ${fmtN(v)}`; };
const tone = v => v > 0.004 ? 'text-emerald-400' : v < -0.004 ? 'text-rose-400' : 'text-slate-300';
const fmtDate = t => new Date(t).toLocaleDateString([], {day:'numeric', month:'short', year:'numeric'});
let toastT;
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.style.opacity = '1'; clearTimeout(toastT); toastT = setTimeout(() => t.style.opacity = '0', 2200); }

/* ================== SCORING ==================
   Maal of a seen player counts; an unseen player's maal is 0.
   Total maal T = sum of everyone's maal. Each player gets (players × own maal) − T.
   Game points: every other player pays the winner (seen / unseen rate, + dublee bonus if the winner finished on dublee).
   The hand always sums to zero. */
function score(h, c){
  const n = h.parts.length, M = {}, game = {}, pt = {};
  let T = 0;
  h.parts.forEach(id => { M[id] = h.st[id] === 'seen' ? Math.min(MAAL_MAX, Math.max(0, Math.round(num(h.maal[id])))) : 0; T += M[id]; game[id] = 0; });
  if (h.winner && h.parts.includes(h.winner)){
    h.parts.forEach(id => {
      if (id === h.winner) return;
      const g = (h.st[id] === 'seen' ? num(c.seenPts) : num(c.unseenPts)) + (h.dublee && n >= 4 ? num(c.dubleeBonus) : 0);
      game[id] -= g; game[h.winner] += g;
    });
  }
  h.parts.forEach(id => pt[id] = n * M[id] - T + game[id]);
  return { M, T, game, pt };
}
function maxFor(it, cnt){ return it.k === 'tiplu' ? 2 - num(cnt.marriage) : (it.k === 'poplu' || it.k === 'jhiplu') ? 3 - num(cnt.marriage) : it.max; }
function itemPts(it, cnt){
  const v = S.config.vals[it.k], c = num(cnt[it.k]);
  if (it.each) return c * num(v);
  if (!c) return 0;
  return num(c === 3 && cnt[it.k + 'T'] ? v[3] : v[c - 1]);
}
function calcMaal(cnt){ return MAAL.reduce((a,it) => a + itemPts(it, cnt), 0); }
function normVals(c){
  MAAL.forEach(it => { c.vals[it.k] = it.each ? Math.max(0, num(c.vals[it.k])) : c.vals[it.k].map(x => Math.max(0, num(x))); });
}

/* ================== LEDGER & SETTLEMENT ================== */
function ledger(){
  const L = {};
  S.players.forEach(p => L[p.id] = { id:p.id, name:p.name, played:0, won:0, seen:0, maal:0, pts:0 });
  S.hands.forEach(h => h.parts.forEach(id => {
    const r = L[id]; if (!r) return;
    r.played++; r.pts += h.pt[id] || 0; r.maal += h.M[id] || 0;
    if (h.st[id] === 'seen') r.seen++;
    if (h.winner === id) r.won++;
  }));
  const rows = Object.values(L);
  rows.sort((a,b) => b.pts - a.pts || b.won - a.won);
  rows.forEach((r,i) => r.rank = (i > 0 && Math.abs(r.pts - rows[i-1].pts) < 1e-9) ? rows[i-1].rank : i+1);
  return rows;
}
function transfers(rows){
  const cr = [], db = [];
  rows.forEach(r => { const c = r2(r.pts * rate()); if (c > 0.004) cr.push({n:r.name, a:c}); else if (c < -0.004) db.push({n:r.name, a:-c}); });
  cr.sort((a,b) => b.a - a.a); db.sort((a,b) => b.a - a.a);
  const out = []; let i = 0, j = 0;
  while (i < db.length && j < cr.length){
    const x = r2(Math.min(db[i].a, cr[j].a));
    if (x > 0) out.push({ from:db[i].n, to:cr[j].n, amt:x });
    db[i].a = r2(db[i].a - x); cr[j].a = r2(cr[j].a - x);
    if (db[i].a < 0.005) i++; if (cr[j].a < 0.005) j++;
  }
  return out;
}

/* ================== HAND DRAFT ================== */
function seatOrder(){
  const n = S.players.length, out = [];
  for (let k = 1; k <= n; k++){ const p = S.players[(S.dealer + k) % n]; if (!S.sitOut.includes(p.id)) out.push(p.id); }
  return out;
}
function ensureDraft(){
  if (S.settled) return;
  let h = S.current;
  if (!h){ h = S.current = { parts:[], st:{}, maal:{}, cnt:{}, open:null, winner:null, dublee:false, editing:null }; }
  if (h.editing) return;
  h.parts = seatOrder();
  h.parts.forEach(id => { if (!h.st[id]) h.st[id] = 'seen'; if (h.maal[id] === undefined) h.maal[id] = ''; if (!h.cnt[id]) h.cnt[id] = {}; });
  if (h.winner && !h.parts.includes(h.winner)) h.winner = null;
}
function saveHand(){
  const h = S.current, c = S.config;
  if (h.parts.length < HAND_MIN) return toast(`At least ${HAND_MIN} players must play the hand`);
  if (h.parts.length > HAND_MAX) return toast(`Marriage is ${HAND_MIN}–${HAND_MAX} players a hand — sit someone out`);
  const bad = h.parts.find(id => h.st[id] === 'seen' && h.maal[id] !== '' && (!Number.isInteger(Number(h.maal[id])) || num(h.maal[id]) < 0 || num(h.maal[id]) > MAAL_MAX));
  if (bad) return toast(`${pname(bad)}'s maal must be a whole number from 0 to ${MAAL_MAX}`);
  if (h.dublee && h.parts.length < 4) h.dublee = false;
  if (!h.winner) return toast('Tap 🏆 on the player who finished the game');
  if (h.st[h.winner] !== 'seen') return toast('The winner must have seen the maal');
  const s = score(h, c);
  const rec = { no: h.editing || S.hands.length + 1, parts:[...h.parts], st:{...h.st}, M:s.M, T:s.T, pt:s.pt,
    winner:h.winner, dublee:!!h.dublee, cnt:JSON.parse(JSON.stringify(h.cnt)), ts: Date.now(),
    rules:{ seenPts:num(c.seenPts), unseenPts:num(c.unseenPts), dubleeBonus:num(c.dubleeBonus) } };
  if (h.editing){
    const i = S.hands.findIndex(x => x.no === h.editing);
    rec.ts = S.hands[i].ts; S.hands[i] = rec;
    toast(`Hand #${rec.no} updated`);
  } else {
    S.hands.push(rec);
    S.dealer = (S.dealer + 1) % S.players.length;
    toast(`🏆 ${pname(h.winner)} wins hand #${rec.no} · ${pts(s.pt[h.winner])} pts`);
  }
  S.current = null; touch();
  if (h.editing) S.tab = 'history';
}

/* ================== DIALOG ================== */
let pendingAsk = null;
function ask(title, msg, okLabel, cb, input){ pendingAsk = { title, msg, okLabel, cb, input }; }
function renderAsk(){
  const a = pendingAsk;

}

/* ================== ACTION MAP ================== */
const A = {
  askNo: () => pendingAsk = null,
  askYes: () => { const a = pendingAsk, el = document.getElementById('askInp'); pendingAsk = null; a.cb(el ? el.value : undefined); },

  home: () => { S = null; window.scrollTo(0,0); },
  newGame: () => ask('Name this game', 'Each game keeps its own players, hands and leaderboard.', 'Create game', name => {
    name = (name || '').trim() || `Game ${DB.games.length + 1}`;
    const last = DB.games.slice().sort((a,b) => (b.updated||0) - (a.updated||0))[0];
    const g = Object.assign(fresh(), { name });
    if (last) g.config = JSON.parse(JSON.stringify(last.config));   // reuse last stakes & maal values; players start empty
    DB.games.push(g); S = g; window.scrollTo(0,0); persistStorage();
    toast(`“${name}” created — add players and start`);
  }, `Game ${DB.games.length + 1}`),
  openGame: d => { openGame(d.id); window.scrollTo(0,0); },
  renameGame: d => { const g = DB.games.find(x => x.id === d.id); if (!g) return;
    ask('Rename game', 'Give this game a new name.', 'Save', name => { name = (name||'').trim(); if (name) g.name = name; }, g.name); },
  delGame: d => { const g = DB.games.find(x => x.id === d.id); if (!g) return;
    ask(`Delete “${g.name}”?`, 'This game, its hands and its leaderboard will be removed for good.', 'Delete game', () => {
      DB.games.splice(DB.games.indexOf(g), 1); if (S && S.id === g.id) S = null; }); },

  addName: () => { if (S.setupNames.length < 8) S.setupNames.push(''); },
  rmName: d => { if (S.setupNames.length > 2) S.setupNames.splice(+d.i, 1); },
  start: () => {
    const c = S.config, names = S.setupNames.map(s => s.trim());
    if (names.length < HAND_MIN) return toast(`Need at least ${HAND_MIN} players`);
    if (names.length > ROSTER_MAX) return toast(`At most ${ROSTER_MAX} players`);
    if (names.some(n => !n)) return toast('Fill in every player name');
    if (new Set(names.map(n => n.toLowerCase())).size !== names.length) return toast('Player names must be unique');
    ['rate','seenPts','unseenPts','dubleeBonus'].forEach(k => c[k] = num(c[k]));
    normVals(c);
    if (!(c.rate > 0)) return toast('Rate per point must be greater than 0');
    if ([c.seenPts, c.unseenPts, c.dubleeBonus].some(x => x < 0)) return toast('Points cannot be negative');
    S.players = names.map((n,i) => ({ id:'p' + i + uid().slice(0,3), name:n }));
    Object.assign(S, { phase:'game', tab:'table', hands:[], current:null, sitOut:S.players.slice(HAND_MAX).map(p => p.id), dealer:0, settled:false });
    touch();
  },

  tab: d => S.tab = d.v,
  toggleSit: d => { if (S.current && S.current.editing) return; const i = S.sitOut.indexOf(d.id); i >= 0 ? S.sitOut.splice(i,1) : S.sitOut.push(d.id); },
  addPlayer: () => ask('Add a player', 'They join from the next hand with a zero balance.', 'Add player', name => {
    name = (name || '').trim();
    if (!name) return toast('Enter a name');
    if (S.players.some(p => p.name.toLowerCase() === name.toLowerCase())) return toast('That name is already playing');
    if (S.players.length >= ROSTER_MAX) return toast(`At most ${ROSTER_MAX} players in a game`);
    S.players.push({ id:'p' + uid(), name }); touch();
  }, ''),
  st: d => { const h = S.current; h.st[d.id] = d.v; if (d.v === 'unseen' && h.winner === d.id) h.winner = null; if (d.v === 'unseen' && h.open === d.id) h.open = null; },
  win: d => { const h = S.current; if (h.st[d.id] !== 'seen') h.st[d.id] = 'seen'; h.winner = h.winner === d.id ? null : d.id; },
  calc: d => { const h = S.current; h.open = h.open === d.id ? null : d.id; },
  cnt: d => { const h = S.current, c = h.cnt[d.id] || (h.cnt[d.id] = {}), it = MAAL.find(x => x.k === d.k);
    const nv = num(c[d.k]) + num(d.d), mx = maxFor(it, c);
    if (nv > mx) return toast(`Max ${mx} ${it.l}${d.k==='tiplu'||d.k==='poplu'||d.k==='jhiplu' ? (num(c.marriage) ? ' outside the marriage' : '') : ''} for one player`);
    c[d.k] = Math.max(0, nv);
    if (d.k === 'marriage'){ ['tiplu','poplu','jhiplu'].forEach(k => { const m = maxFor(MAAL.find(x => x.k === k), c); if (num(c[k]) > m) c[k] = m; }); }
    MAAL.forEach(x => { if (num(c[x.k]) !== 3) delete c[x.k + 'T']; });
    h.maal[d.id] = calcMaal(c); },
  cntT: d => { const h = S.current, c = h.cnt[d.id]; c[d.k + 'T'] = !c[d.k + 'T']; h.maal[d.id] = calcMaal(c); },
  clearCnt: d => { const h = S.current; h.cnt[d.id] = {}; h.maal[d.id] = ''; },
  dublee: () => S.current.dublee = !S.current.dublee,
  saveHand,
  clearHand: () => ask('Clear this hand?', 'Everything entered for this hand will be cleared.', 'Clear', () => { S.current = null; }),
  cancelEdit: () => { S.current = null; S.tab = 'history'; },
  editHand: d => {
    if (S.settled) return toast('Resume the game to edit hands');
    const h = S.hands.find(x => String(x.no) === d.no); if (!h) return;
    S.current = { parts:[...h.parts], st:{...h.st}, maal:{...h.M}, cnt:JSON.parse(JSON.stringify(h.cnt || {})), open:null,
      winner:h.winner, dublee:h.dublee, editing:h.no };
    h.parts.forEach(id => { if (h.st[id] !== 'seen') S.current.maal[id] = ''; });
    S.tab = 'table'; window.scrollTo(0,0);
  },
  delHand: d => ask(`Delete hand #${d.no}?`, 'Balances will be recalculated.', 'Delete hand', () => {
    S.hands = S.hands.filter(h => String(h.no) !== d.no); S.hands.forEach((h,i) => h.no = i + 1); S.current = null; touch(); }),

  settle: () => {
    if (S.current && S.current.editing) return toast('Finish editing the hand first');
    if (!S.hands.length) return toast('Record at least one hand first');
    ask('Settle the game?', 'The leaderboard and payments become final. You can resume later if more hands are played.', 'Settle game', () => {
      S.settled = true; S.current = null; S.tab = 'board'; touch(); });
  },
  resume: () => { S.settled = false; S.tab = 'table'; },
  editSetup: () => { S.phase = 'setup'; if (!S.setupNames.length) S.setupNames = S.players.map(p => p.name); },
  copy: () => copyText(summaryText()),
};

  </nav>
  ${body}
  <div class="fixed bottom-0 inset-x-0 z-30 bg-slate-950/85 backdrop-blur border-t border-slate-800">
    <div class="max-w-3xl mx-auto px-4 py-3 flex gap-2" style="padding-bottom:max(.75rem,env(safe-area-inset-bottom))">
      ${S.settled
        ? `<button data-a="copy" class="btn-ghost flex-1">📋 Copy summary</button><button data-a="home" class="btn-primary flex-1">All games</button>`
        : `<button data-a="tab" data-v="board" class="btn-ghost flex-1">Standings</button><button data-a="settle" class="btn-primary flex-[2]">💰 Settle game</button>`}
    </div>
  </div>`;
}

function renderTable(){
  if (S.settled) return `<div class="card text-center text-slate-400 py-10">This game is settled.<br>Tap <b>Resume</b> to keep playing, or see the Leaderboard.</div>`;
  ensureDraft();
  const h = S.current, n = S.players.length, editing = h.editing;
  const s = score(h, S.config), over = h.parts.length > HAND_MAX, dubOk = h.parts.length >= 4;
  const row = id => {
    const seen = h.st[id] === 'seen', win = h.winner === id, cnt = h.cnt[id] || {}, open = h.open === id;
    return `
    <div class="rounded-2xl border p-3 mb-2 ${win?'border-amber-400 bg-amber-400/10':'border-slate-700 bg-slate-800/30'}">
      <div class="flex items-center gap-2">
        <div class="flex-1 min-w-0">
          <div class="font-semibold truncate">${win?'🏆 ':''}${esc(pname(id))}</div>
        </div>
        <div class="flex rounded-lg overflow-hidden border border-slate-700 shrink-0">
          <button data-a="st" data-id="${id}" data-v="seen" class="seg ${seen?'bg-sky-500 text-slate-950':'bg-slate-800 text-slate-400'}">Seen</button>
          <button data-a="st" data-id="${id}" data-v="unseen" class="seg ${!seen?'bg-violet-500 text-slate-950':'bg-slate-800 text-slate-400'}">Unseen</button>
        </div>
      </div>
      <div class="flex items-center gap-2 mt-2">
        <input type="number" inputmode="numeric" min="0" max="${MAAL_MAX}" step="1" data-maal="${id}" enterkeyhint="done" aria-label="Maal for ${esc(pname(id))}" value="${seen ? esc(h.maal[id]) : ''}" ${seen?'':'disabled'}
          placeholder="${seen?'Maal':'No maal'}" class="inp !w-20 !py-2 text-center font-bold">
        <button data-a="calc" data-id="${id}" class="btn-ghost !py-2 !px-2.5 ${open?'!border-amber-400 !text-amber-300':''}" ${seen?'':'disabled'} title="Maal calculator">🧮</button>
        <button data-a="win" data-id="${id}" class="btn !py-2 whitespace-nowrap ${win?'bg-amber-400 text-slate-950':'bg-slate-800 text-slate-300 border border-slate-700'}" aria-label="Winner" aria-pressed="${win}">🏆${win?' Winner':''}</button>
        <div class="ml-auto text-right whitespace-nowrap">
          <div id="pv-${id}" class="font-extrabold ${tone(s.pt[id])}">${pts(s.pt[id])}</div>
          <div id="pm-${id}" class="text-[11px] text-slate-500">${money(s.pt[id])}</div>
        </div>
      </div>
      ${open && seen ? `
      <div class="mt-3 pt-3 border-t border-slate-700">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-1.5">
          ${MAAL.map(it => { const c = num(cnt[it.k]), mx = maxFor(it, cnt), p = itemPts(it, cnt); return `
            <div class="bg-slate-900/60 rounded-lg px-2 py-1.5">
              <div class="flex items-center justify-between gap-2">
                <span class="text-sm min-w-0">${it.l} <span class="text-[11px] ${p?'text-amber-300':'text-slate-500'}">${p ? '= ' + p : 'max ' + mx}</span></span>
                <span class="flex items-center gap-1 shrink-0">
                  <button data-a="cnt" data-id="${id}" data-k="${it.k}" data-d="-1" class="step" aria-label="One less ${it.l}" ${c?'':'disabled'}>−</button>
                  <span class="w-6 text-center font-bold">${c}</span>
                  <button data-a="cnt" data-id="${id}" data-k="${it.k}" data-d="1" class="step" aria-label="One more ${it.l}" ${c<mx?'':'disabled'}>+</button>
                </span>
              </div>
              ${!it.each && it.cols === 4 && c === 3 ? `<button data-a="cntT" data-id="${id}" data-k="${it.k}" role="checkbox" aria-checked="${!!cnt[it.k+'T']}" class="w-full flex items-center gap-2 text-xs text-slate-300 mt-1 py-2 text-left">
                <span class="w-5 h-5 shrink-0 rounded border-2 grid place-items-center text-[11px] font-black text-slate-950 ${cnt[it.k+'T']?'bg-amber-400 border-amber-400':'border-slate-500'}">${cnt[it.k+'T']?'✓':''}</span>
                Shown as a tunnela (${esc(S.config.vals[it.k][3])} instead of ${esc(S.config.vals[it.k][2])})</button>` : ''}
            </div>`; }).join('')}
        </div>
        <div class="flex items-center justify-between mt-2 text-sm">
          <button data-a="clearCnt" data-id="${id}" class="min-h-[36px] px-2 -ml-2 text-xs text-slate-400 hover:text-rose-300">Clear calculator</button>
          <span>Maal = <b class="text-amber-300">${calcMaal(cnt)}</b></span>
        </div>
      </div>` : ''}
    </div>`;
  };
  return `
  ${editing ? `<div class="rounded-2xl bg-sky-500/15 border border-sky-500/40 p-3 mb-4 text-sm text-sky-200">✏️ Editing hand #${editing}. Save to update the leaderboard.</div>` : `
  <section class="card">
    <h2 class="h2">Hand #${S.hands.length+1} · players <span class="normal-case font-semibold text-slate-500 whitespace-nowrap">tap to sit out</span></h2>
    <div class="flex flex-wrap gap-2 mb-3">
      ${S.players.map((p,i) => { const out = S.sitOut.includes(p.id); return `
        <button data-a="toggleSit" data-id="${p.id}" class="rounded-xl px-3 py-2 text-sm font-semibold border transition ${out?'border-slate-700 text-slate-500 line-through':'border-emerald-500/50 bg-emerald-500/10 text-emerald-200'}">
          ${esc(p.name)}${i===S.dealer%n?' <span class="ml-1 pill bg-amber-400 text-slate-950">D</span>':''}
        </button>`; }).join('')}
      <button data-a="addPlayer" class="rounded-xl px-3 py-2 text-sm font-semibold border border-dashed border-slate-600 text-slate-400">+ Player</button>
    </div>
    <label class="lbl">Dealer</label>
    <select data-sel="dealer" class="sel">${S.players.map((p,i) => `<option value="${i}" ${i===S.dealer%n?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
    ${over ? `<p class="text-sm text-rose-300 mt-3">⚠ ${h.parts.length} players selected — a Marriage hand is ${HAND_MIN}–${HAND_MAX}. Tap names to sit ${h.parts.length - HAND_MAX} out.</p>` : ''}
  </section>`}

  <section class="felt rounded-3xl p-4 mb-4 border border-emerald-800 text-center shadow-lg">
    <div class="text-xs uppercase tracking-[.2em] text-emerald-200/80 font-bold">Total maal on the table</div>
    <div id="pvT" class="text-4xl font-extrabold text-amber-300 my-1">${s.T}</div>
    <div id="pvSum" class="text-[11px] text-emerald-200/80">${sumLine(h, s)}</div>
  </section>

  <section class="card !p-3">
    <h2 class="h2 px-1 !mb-2">Enter maal & pick the winner</h2>
    ${h.parts.length ? h.parts.map(row).join('') : `<p class="text-sm text-slate-500 p-2">Select ${HAND_MIN}–${HAND_MAX} players above.</p>`}
    <button data-a="dublee" ${dubOk?'':'disabled'} role="switch" aria-checked="${!!(h.dublee&&dubOk)}" class="w-full flex items-center gap-3 mt-2 px-1 py-2.5 text-left disabled:opacity-60">
      <span class="w-11 h-6 shrink-0 rounded-full relative transition ${h.dublee&&dubOk?'bg-amber-400':'bg-slate-700'}">
        <span class="absolute top-0.5 ${h.dublee&&dubOk?'left-[22px]':'left-0.5'} w-5 h-5 rounded-full bg-white transition-all"></span></span>
      <span class="text-sm">Winner finished with <b>8 dublees</b> ${!dubOk ? '<span class="text-slate-500">(needs 4+ players)</span>' : num(S.config.dubleeBonus)?`<span class="text-slate-500">(+${esc(S.config.dubleeBonus)} from each player)</span>`:''}</span>
    </button>
  </section>

  <div class="grid grid-cols-3 gap-2 mb-4">
    ${editing ? `<button data-a="cancelEdit" class="btn-ghost">Cancel</button>` : `<button data-a="clearHand" class="btn-ghost">Clear</button>`}
    <button data-a="saveHand" class="btn-green col-span-2 py-3.5 text-base" ${h.parts.length<HAND_MIN||over?'disabled':''}>✓ ${editing?'Update':'Save'} hand</button>
  </div>
  ${!editing && S.hands.length ? miniStandings() : ''}`;
}
function sumLine(h, s){
  const total = h.parts.reduce((a,id) => a + s.pt[id], 0);
  const seen = h.parts.filter(id => h.st[id] === 'seen').length;
  return `${seen} seen · ${h.parts.length - seen} unseen · ${h.winner ? '🏆 ' + esc(pname(h.winner)) : 'no winner yet'} · ${Math.abs(total) < 1e-9 ? '✓ hand balances to 0' : '⚠ check'}`;
}
function updatePreview(){
  const h = S.current; if (!h) return;
  const s = score(h, S.config);
  h.parts.forEach(id => {
    const a = document.getElementById('pv-' + id), b = document.getElementById('pm-' + id);
    if (a){ a.textContent = pts(s.pt[id]); a.className = 'font-extrabold ' + tone(s.pt[id]); }
    if (b) b.textContent = money(s.pt[id]);
  });
  const t = document.getElementById('pvT'); if (t) t.textContent = s.T;
  const u = document.getElementById('pvSum'); if (u) u.innerHTML = sumLine(h, s);
}

function miniStandings(){
  const rows = ledger();
  return `<section class="card"><h2 class="h2">Live standings <button data-a="tab" data-v="board" class="normal-case text-amber-300">Full board →</button></h2>
    ${rows.map(r => `<div class="flex justify-between py-1.5 border-b border-slate-800 last:border-0 text-sm">
      <span><span class="text-slate-500 w-6 inline-block">${r.rank}.</span>${esc(r.name)}</span>
      <span><span class="font-bold ${tone(r.pts)}">${pts(r.pts)}</span> <span class="text-xs text-slate-500">${money(r.pts)}</span></span></div>`).join('')}</section>`;
}

/* ================== RENDER: LEADERBOARD ================== */
function renderBoard(){
  const rows = ledger(), tr = transfers(rows);
  const totalMaal = S.hands.reduce((a,h) => a + h.T, 0);
  const best = S.hands.reduce((b,h) => { const w = h.pt[h.winner] || 0; return !b || w > b.w ? { w, name:pname(h.winner), no:h.no } : b; }, null);
  const medal = r => r === 1 ? '🥇' : r === 2 ? '🥈' : r === 3 ? '🥉' : r;
  const label = v => v > 0.004 ? ['Receives','text-emerald-300'] : v < -0.004 ? ['Pays','text-rose-300'] : ['Even','text-slate-400'];
  return `
  <div class="grid grid-cols-3 gap-2 mb-4 text-center">
    <div class="card !mb-0 !p-3"><div class="text-xl font-extrabold">${S.hands.length}</div><div class="text-[11px] text-slate-400">Hands</div></div>
    <div class="card !mb-0 !p-3"><div class="text-xl font-extrabold text-amber-300">${totalMaal}</div><div class="text-[11px] text-slate-400">Total maal</div></div>
    <div class="card !mb-0 !p-3"><div class="text-xl font-extrabold text-emerald-300">${best ? pts(best.w) : '—'}</div><div class="text-[11px] text-slate-400 truncate">${best ? 'Best win · ' + esc(best.name) : 'Best win'}</div></div>
  </div>

  <section class="card">
    <h2 class="h2">Leaderboard ${S.settled?'<span class="pill bg-emerald-500/20 text-emerald-300 normal-case">Final</span>':'<span class="normal-case font-semibold text-slate-500">live</span>'}</h2>
    <div class="sm:hidden space-y-2">
      ${rows.map(r => { const [lb, lc] = label(r.pts); return `
        <div class="grid grid-cols-[2rem_1fr_auto] gap-2 items-center p-3 rounded-xl ${r.rank===1&&r.pts>0?'bg-amber-400/10 ring-1 ring-amber-400/40':'bg-slate-800/50'}">
          <div class="text-lg text-center font-bold">${medal(r.rank)}</div>
          <div class="min-w-0"><div class="font-semibold truncate">${esc(r.name)}</div>
            <div class="text-[11px] text-slate-400">Played ${r.played} · Won ${r.won} · Seen ${r.seen}</div>
            <div class="text-[11px] text-slate-400">Maal ${r.maal} · <span class="${tone(r.pts)}">${pts(r.pts)} pts</span></div></div>
          <div class="text-right"><div class="font-extrabold ${tone(r.pts)}">${money(r.pts)}</div><div class="text-[10px] uppercase font-bold ${lc}">${lb}</div></div>
        </div>`; }).join('')}
    </div>
    <div class="hidden sm:block overflow-x-auto">
      <table class="w-full text-sm">
        <thead><tr class="text-left text-xs uppercase tracking-wider text-slate-500 border-b border-slate-800">
          <th class="py-2 pr-2">#</th><th class="pr-2">Player</th><th class="text-center">Played</th><th class="text-center">Won</th>
          <th class="text-center">Seen</th><th class="text-right">Maal</th><th class="text-right">Points</th><th class="text-right">Net Rs.</th></tr></thead>
        <tbody>${rows.map(r => `
          <tr class="border-b border-slate-800/70 last:border-0 ${r.rank===1&&r.pts>0?'bg-amber-400/5':''}">
            <td class="py-2.5 pr-2 font-bold">${medal(r.rank)}</td><td class="pr-2 font-semibold">${esc(r.name)}</td>
            <td class="text-center text-slate-300">${r.played}</td><td class="text-center text-slate-300">${r.won}</td>
            <td class="text-center text-slate-300">${r.seen}</td><td class="text-right text-slate-300">${r.maal}</td>
            <td class="text-right ${tone(r.pts)}">${pts(r.pts)}</td>
            <td class="text-right font-extrabold ${tone(r.pts)}">${money(r.pts)}</td></tr>`).join('')}</tbody>
      </table>
    </div>
  </section>

  <section class="card">
    <h2 class="h2">💸 Who pays whom <span class="normal-case font-semibold text-slate-500">${tr.length} payment${tr.length===1?'':'s'}</span></h2>
    ${tr.length ? tr.map(t => `
      <div class="flex items-center justify-between gap-2 py-2.5 border-b border-slate-800 last:border-0">
        <div class="text-sm"><b class="text-rose-300">${esc(t.from)}</b> <span class="text-slate-500">pays</span> <b class="text-emerald-300">${esc(t.to)}</b></div>
        <div class="font-extrabold text-amber-300 whitespace-nowrap">Rs. ${t.amt.toLocaleString('en-IN',{maximumFractionDigits:2})}</div>
      </div>`).join('') : '<p class="text-sm text-slate-500">No payments due yet.</p>'}
    <button data-a="copy" class="btn-ghost w-full mt-3">📋 Copy summary (WhatsApp / Viber)</button>
  </section>`;
}

/* ================== RENDER: HISTORY ================== */
function renderHistory(){
  if (!S.hands.length) return `<div class="card text-center text-slate-500 py-10">No hands recorded yet.</div>`;
  return [...S.hands].reverse().map(h => `
    <details class="card !p-0 overflow-hidden">
      <summary class="p-4 cursor-pointer list-none flex items-center justify-between gap-2">
        <div class="min-w-0"><div class="font-semibold">#${h.no} · ${esc(pname(h.winner))} 🏆${h.dublee?' <span class="pill bg-amber-400/20 text-amber-300">Dublee</span>':''}</div>
          <div class="text-xs text-slate-400 truncate">Total maal ${h.T} · ${h.parts.length} players · ${new Date(h.ts).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div></div>
        <div class="font-bold text-emerald-300 whitespace-nowrap">${pts(h.pt[h.winner])}</div>
      </summary>
      <div class="px-4 pb-4 text-sm">
        ${h.parts.map(id => `
          <div class="flex justify-between py-1.5 border-b border-slate-800 last:border-0">
            <span>${esc(pname(id))} <span class="text-xs ${h.st[id]==='seen'?'text-sky-300':'text-violet-300'}">· ${h.st[id]==='seen' ? 'maal ' + h.M[id] : 'unseen'}</span></span>
            <span><span class="${tone(h.pt[id])} font-semibold">${pts(h.pt[id])}</span> <span class="text-xs text-slate-500">${money(h.pt[id])}</span></span></div>`).join('')}
        <div class="grid grid-cols-2 gap-2 mt-3">
          <button data-a="editHand" data-no="${h.no}" class="btn-ghost py-2 text-xs">✏️ Edit hand</button>
          <button data-a="delHand" data-no="${h.no}" class="btn-red py-2 text-xs">Delete hand</button>
        </div>
      </div>
    </details>`).join('');
}

/* ================== SUMMARY / COPY ================== */
function summaryText(){
  const rows = ledger(), tr = transfers(rows), c = S.config;
  let t = `💍 Marriage — ${S.name} — ${new Date().toLocaleDateString()}\n${S.hands.length} hands · Rs. ${c.rate} per point\n\n🏆 Leaderboard\n`;
  rows.forEach(r => t += `${r.rank}. ${r.name}: ${money(r.pts)}  (${pts(r.pts)} pts, won ${r.won})\n`);
  t += `\n💸 Who pays whom\n` + (tr.length ? tr.map(x => `• ${x.from} → ${x.to}: Rs. ${x.amt.toLocaleString('en-IN')}`).join('\n') : 'No payments due');
  return t;
}
function copyText(text){
  const done = () => toast('Summary copied');
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, () => fallback());
  else fallback();
  function fallback(){ const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch(e) { prompt('Copy this summary:', text); } ta.remove(); }
}

/* ================== PHONE & APP HELPERS ================== */
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (!S) render(); });
window.addEventListener('appinstalled', () => { installEvt = null; toast('Installed — open it from your home screen'); if (!S) render(); });
A.install = () => { if (!installEvt) return; installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; render(); }); };
A.hideIosHint = () => { DB.iosHintOff = true; };
function installCard(){
  if (isStandalone()) return '';
  if (installEvt) return `<button data-a="install" class="btn-ghost w-full py-3 mb-4 !border-amber-400/50 !text-amber-200">📲 Install app on this phone</button>`;
  if (isIOS && !DB.iosHintOff) return `
    <div class="card !p-3 flex items-start gap-3 text-sm text-slate-300">
      <span class="text-xl">📲</span>
      <span class="flex-1">Install it: tap <b>Share</b> <span class="text-slate-400">(□↑)</span> in Safari, then <b>Add to Home Screen</b>. It then opens full-screen and works offline.</span>
      <button data-a="hideIosHint" class="btn-ghost !min-h-0 w-8 h-8 !p-0 shrink-0" aria-label="Hide">✕</button>
    </div>`;
  return '';
}
// Keep the screen awake while a game is open (released on the home screen or when settled).
let wakeLock = null;
async function keepAwake(on){
  try {
    if (on && !wakeLock && 'wakeLock' in navigator && document.visibilityState === 'visible'){
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => wakeLock = null);
    } else if (!on && wakeLock){ const w = wakeLock; wakeLock = null; await w.release(); }
  } catch(e){}
}
const wantAwake = () => !!S && S.phase === 'game' && !S.settled;
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(wantAwake()); });
// Android / browser back button: close dialog → leave edit → back to Table → back to game list.
function syncHistory(){
  const deep = !!S || !!pendingAsk, st = history.state && history.state.deep;
  try { if (deep && !st) history.pushState({ deep:1 }, ''); else if (!deep && st) history.back(); } catch(e){}
}
window.addEventListener('popstate', () => {
  if (pendingAsk) pendingAsk = null;
  else if (S && S.current && S.current.editing){ S.current = null; S.tab = 'history'; }
  else if (S && S.phase === 'game' && S.tab !== 'table') S.tab = 'table';
  else if (S) S = null;
  render();
});
function persistStorage(){ try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e){} }
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol))
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));

/* ================== RENDER LOOP & EVENTS ================== */
function render(){
  save();
  document.getElementById('app').innerHTML = !S ? renderHome() : S.phase === 'setup' ? renderSetup() : renderGame();
  document.getElementById('modal').innerHTML = pendingAsk ? renderAsk() : '';
  const ai = document.getElementById('askInp'); if (ai){ ai.focus(); ai.select(); }
  keepAwake(wantAwake()); syncHistory();
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  const fn = A[el.dataset.a]; if (fn){ fn(el.dataset); render(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'askInp'){ A.askYes(); render(); }
  else if (e.key === 'Enter' && e.target.dataset.maal) e.target.blur();
});
document.addEventListener('focusin', e => { if (e.target.dataset && e.target.dataset.maal) try { e.target.select(); } catch(_){} });
document.addEventListener('input', e => {
  const t = e.target, d = t.dataset;
  if (d.name !== undefined){ S.setupNames[+d.name] = t.value; save(); }
  else if (d.cfg){ S.config[d.cfg] = t.value; save(); }
  else if (d.val){ if (d.i !== undefined) S.config.vals[d.val][+d.i] = t.value; else S.config.vals[d.val] = t.value; save(); }
  else if (d.maal && S.current){ S.current.maal[d.maal] = t.value; S.current.cnt[d.maal] = {}; save(); updatePreview(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.sel === 'dealer'){ S.dealer = +t.value; S.current && !S.current.editing && (S.current.parts = []); render(); }
});
render();
</script>
</body>
</html>
